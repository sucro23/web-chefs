<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naija Delights - Authentic Nigerian Menu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="menu.css">
</head>
<body>

    <div class="container">
        <header class="menu-header">
            <span class="sub-title">Taste Of Naija</span>
            <h1 class="main-title">Our Authentic Menu</h1>
            <p class="menu-description">Explore our rich selection of traditional delicacies, fiery grills, hearty soups, fresh swallows, and chilled local refreshments.</p>

            <div class="search-container">
                <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
                <input type="text" id="searchInput" class="search-input" placeholder="Search Jollof, Suya, Egusi, Zobo..." />
            </div>
        </header>

        <div class="categories-wrapper">
            <nav class="categories-nav" id="categoriesNav">
                <button class="cat-btn active" data-category="all">All Items</button>
                <button class="cat-btn" data-category="mains">Main Dishes & Rice</button>
                <button class="cat-btn" data-category="soups">Soups & Swallows</button>
                <button class="cat-btn" data-category="grills">Grill & Street Food</button>
                <button class="cat-btn" data-category="snacks">Snacks & Chops</button>
                <button class="cat-btn" data-category="drinks">Drinks & Drinks</button>
            </nav>
        </div>

        <main class="menu-grid" id="menuGrid">
            <!-- Dynamically Populated by JavaScript -->
        </main>

        <div id="emptyState" class="empty-state">
            <span class="empty-icon">🍲</span>
            <h3 class="empty-title">No Dishes Found</h3>
            <p class="empty-sub">Try searching for something else or switch categories.</p>
        </div>
    </div>

    <script src="menu.js"></script>
</body>
</html>
